name: reporte
on:
  schedule:
    # Cada media hora (minutos 7 y 37: GitHub retrasa o se salta los cron en punto; el
    # 29-sep-2026 disparó uno con 5.5 h de retraso). El script solo trabaja si hay un reporte
    # pendiente cuya ventana sigue abierta (ver horario.VENTANAS) y no lo repite.
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      tipo:
        description: "auto | martes | viernes | domingo"
        default: "auto"
      forzar:
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: reporte
  cancel-in-progress: false
jobs:
  reporte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          ref: datos
          path: datos
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - name: Generar reporte
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CORREO_DESTINO: ${{ secrets.CORREO_DESTINO }}
          PAGES_URL: https://mariocgaitan.github.io/fantasy-nfl
          TIPO: ${{ inputs.tipo || 'auto' }}
          FORZAR: ${{ inputs.forzar && '--forzar' || '' }}
        run: uv run fantasy reporte --tipo "$TIPO" --salida datos $FORZAR
      - name: Publicar en la rama datos
        working-directory: datos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Sin cambios"; exit 0; fi
          git commit -m "reporte $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
